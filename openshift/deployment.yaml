apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-bench
  annotations:
    # roll out automatically when a new build lands in inference-bench:latest
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"inference-bench:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC + one benchmark at a time
  selector:
    matchLabels:
      app: inference-bench
  template:
    metadata:
      labels:
        app: inference-bench
    spec:
      serviceAccountName: inference-bench
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/inference-bench/inference-bench:latest
          args: [serve, -addr, ":8080"]
          ports:
            - containerPort: 8080
          env:
            - {name: DATA_DIR, value: /data}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "4", memory: 1Gi}   # Go client uses several cores at high concurrency
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - {name: data, mountPath: /data}
        - name: oauth-proxy
          # quay.io/openshift/origin-oauth-proxy:4.16 works for OKD/crc
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://localhost:8080
            - --openshift-service-account=inference-bench
            # only users who can get pods in this namespace
            - --openshift-sar={"namespace":"inference-bench","resource":"pods","verb":"get"}
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --skip-auth-regex=^/healthz$
          ports:
            - containerPort: 8443
              name: https
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: proxy-tls, mountPath: /etc/tls/private}
            - {name: proxy-cookie, mountPath: /etc/proxy/secrets}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: inference-bench-data}
        - name: proxy-tls
          secret: {secretName: inference-bench-tls}
        - name: proxy-cookie
          secret: {secretName: inference-bench-cookie}   # created by hand, see README
