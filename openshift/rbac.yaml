apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-bench-resolver
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
# Cluster-wide read so pod/service/route names can be resolved in any namespace.
# Least privilege: replace this ClusterRoleBinding with a RoleBinding (roleRef
# ClusterRole inference-bench-resolver) in each model namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-bench-resolver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-bench-resolver
subjects:
  - kind: ServiceAccount
    name: inference-bench
    namespace: inference-bench
---
# thanos-querier access for DCGM GPU metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-bench-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: inference-bench
    namespace: inference-bench
---
# oauth-proxy checks user tokens / --openshift-sar through the API server
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-bench-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: inference-bench
    namespace: inference-bench
