apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: inference-bench
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: inference-bench
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: inference-bench:latest
